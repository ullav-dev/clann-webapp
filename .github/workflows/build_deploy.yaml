name: build_deploy

on:
  push:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ullav'
      - name: Pin npm to match Docker build (node:22-alpine uses 10.9.x)
        run: npm install -g npm@10.9.8
      - name: Regenerate lock file with pinned npm
        run: npm install --package-lock-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_CLASSIC }}
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_CLASSIC }}
      - name: Run tests
        run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Setup Node (for lock file fix)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ullav'
      - name: Pin npm and regenerate lock file
        run: |
          npm install -g npm@10.9.8
          npm install --package-lock-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_CLASSIC }}
#      - name: Set up QEMU
#        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_CLASSIC }}
      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ullav-dev/clann-webapp:${{ steps.commit.outputs.short }}
            ghcr.io/ullav-dev/clann-webapp:latest
          secrets: |
            npm_token=${{ secrets.PAT_CLASSIC }}
            emailjs_service_id=${{ secrets.EMAILJS_SERVICE_ID }}
            emailjs_template_id=${{ secrets.EMAILJS_TEMPLATE_ID }}
            emailjs_public_key=${{ secrets.EMAILJS_PUBLIC_KEY }}
